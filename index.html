<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel = "stylesheet" href = "styles.css">
  <script src = "script2.js" defer></script>
</head>
<body>
  <main>
    <div class="container">  
      <div class = "title">Mathematical Calculator</div>
      <div class = "results">
        <input class = "display" readonly></input>
      </div>
      <div class = "buttons">
        <div class = "numbers">
          <button class = "clear">CLEAR</button>
          <button class = "number">1</button>
          <button class = "number">2</button>
          <button class = "number">3</button>
          <button class = "number">4</button>
          <button class = "number">5</button>
          <button class = "number">6</button>
          <button class = "number">7</button>
          <button class = "number">8</button>
          <button class = "number">9</button>
          <button class = "number">0</button>
          <button class = "evaluate">=</button>
          <button class = "back">&#x232B</button>

      </div>
        
      <div class = "operations">
        <button class = "operation-plus">+</button>
        <button class = "operation-minus">-</button>
        <button class = "operation-multiplication">*</button>
        <button class = "operation-division">/</button>
        <button class = "number" id="dot">.</button>

      </div>
      </div>
    </div>

  </main>
  
</body>
</html>
